# fly.toml — Fly.io app config for monid-finance-api.
# One machine runs both processes: entrypoint.sh starts uvicorn on
# 127.0.0.1:8000 internally, then execs the Go gateway which listens on
# internal_port and is the only publicly reachable process.
app = "monid-finance-api"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  UPSTREAM = "http://127.0.0.1:8000"
  WEBSITE_ROOT = "/app/website"
  MONID_ALLOWLIST_PATH = "/app/docs/monid_finance_discovery.json"
  # Set real values as secrets, not here: MONID_API_KEY, GATEWAY_API_KEYS,
  # UPSTREAM_API_KEY, CORS_ALLOWED_ORIGINS. See docs/deploy.md.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
